name: Update Space Shooter Game

# Retained for manual use; the profile now displays the 3D calendar.
on:
  workflow_dispatch:

permissions:
  contents: write         # Required to commit the GIF back to your repo

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: czl9707/gh-space-shooter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'
